# Noctalia — the tracked, curated config layer (see home/noctalia.nix for
# the full layering story). Only settings that must hold on BOTH machines
# for the desktop to work belong here; taste-level tweaks live in the
# Settings GUI (SUPER+comma), whose state file overrides this one.
# Hot-reloaded on save — no rebuild, no reload command.
#
# Key reference: `example.toml` in the noctalia source tree documents every
# option at its default. `noctalia config validate` checks this file.

[shell]
# The ONE polkit agent on this session's bus (upstream default is false —
# without this, fprintd-enroll / systctl edits / any privileged GUI action
# has no prompt UI and just fails). The engine half (security.polkit) comes
# from programs.niri; see modules/noctalia.nix.
polkit_agent = true

[shell.screenshot]
# Screenshots flow into satty and NOWHERE else — the raw capture never
# touches disk or clipboard until you commit inside satty (Enter copies +
# saves via home/satty.nix's save-after-copy; Escape discards). Same
# contract as the old DMS screenshot-annotate wrapper, now first-class:
# a cancelled region select simply never spawns the pipe command.
save_to_file = false
copy_to_clipboard = false
pipe_to_command = true
pipe_command = "satty -f -"

[theme]
# Material-You palette derived from the wallpaper (matugen's old job, now
# built into the shell). Pick the wallpaper in the GUI / SUPER+Y; the
# palette and every template below re-render on each change.
source = "wallpaper"

[theme.templates]
# App theming via the shell's built-in template catalog (replaces DMS's
# matugen glue). Deliberately opt-in and minimal — each id below has a
# consumer wired in this repo; add ids only WITH their consumer:
#  * alacritty     → ~/.config/alacritty/themes/noctalia.toml, imported by
#                    home/alacritty.nix (live-reloads on rewrite)
#  * gtk3/gtk4     → ~/.config/gtk-{3,4}.0/noctalia.css + apply.sh, which
#                    @imports it into gtk.css, sets the adw-gtk3(-dark)
#                    theme and the org.gnome color-scheme (the old DMS
#                    "Apply GTK Themes" toggle, automated)
#  * kcolorscheme  → ~/.local/share/color-schemes/noctalia.colors, the
#                    KColorScheme home/qt.nix points qt6ct/qt5ct at
#                    (Dolphin/Ark/VLC colors)
#  * niri          → ~/.config/niri/noctalia.kdl (focus-ring/border/shadow
#                    colors), pulled in by the LAST include in
#                    home/niri/config.kdl (optional=true, so pre-first-
#                    wallpaper it's simply absent). No reload hook needed:
#                    niri watches its includes and re-applies on rewrite —
#                    the [hooks] colors_changed = "hyprctl reload" the
#                    hyprland template needed is gone with it.
# Community templates stay off: nothing here consumes them, and off means
# no fetches from api.noctalia.dev.
enable_builtin_templates = true
builtin_ids = ["alacritty", "gtk3", "gtk4", "kcolorscheme", "niri"]
enable_community_templates = false

[brightness]
# Let the shell drive external monitors over DDC/CI through ddcutil (the
# dms binary spoke DDC natively; noctalia shells out). Load-bearing on the
# PC (two DDC monitors; i2c group + ddcutil package in hosts/unclebeam-pc),
# a quiet no-op on the thinkpad, whose panel uses its kernel backlight.
enable_ddcutil = true

# ── Idle policy ─────────────────────────────────────────────────────────
# Replaces the DMS Settings-GUI idle config (and swayidle before that).
# Upstream ships both behaviors DISABLED — that silent default is exactly
# the "fresh install has no idle lock" trap, so they're declared here.
# lock_before_suspend defaults to true, so lid-close suspend (logind,
# modules/laptop.nix) locks first with no extra config.

[idle.behavior.lock]
timeout = 600 # seconds idle → lock screen
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660 # one minute after the lock, screens power down
action = "screen_off"
enabled = true

[system.monitor]
# Which sysfs file the bar's CPU temperature widget reads. Left unset the
# shell auto-detects k10temp's `Tctl` on the PC — the package CONTROL value
# the boost algorithm and the fan curves consume. We want the RAW SILICON
# reading instead: `Tccd1`, the first chiplet's own die sensor. (Not an
# offset being removed — there is no offset on this part: k10temp publishes
# temp1=Tctl, temp3=Tccd1, temp4=Tccd2 and no temp2/Tdie, and the kernel
# only creates that Tdie channel when a nonzero offset exists. `tempN` is a
# registration index, not a core number.) home/btop.nix pins btop to the
# same sensor so the bar and btop agree.
#
# Know what you are reading here. Tctl behaves like a FILTERED value riding
# near the hottest die and decaying slowly — sampled together, Tctl slid
# smoothly 79 -> 72 C while Tccd1 thrashed 83 -> 54 -> 74 within the same
# few seconds — and it is not an upper bound (measured Tctl=80 vs Tccd1=83).
# Tccd1 is the honest silicon reading but it covers only HALF the CPU: this
# 12-core part is two chiplets, CPUs 0-5,12-17 on CCD1 and 6-11,18-23 on CCD2
# (verified from the per-CCD L3 domains). CCD2 is NOT represented in the bar,
# and it is not always the cooler die — measured Tccd1=54 while Tccd2=67. So
# expect a jumpy number that can under-report the hottest chiplet. That is a
# deliberate trade for seeing raw die temperature rather than the control
# value; the 95 C throttle limit is defined on Tctl, so don't compare this
# number against it.
#
# The path is anchored under k10temp's PCI FUNCTION, not /sys/class/hwmon.
# hwmonN numbering is assigned in driver probe order and shifts if a kernel
# update reorders it or an NVMe drive is added — and /sys/class/hwmon/hwmon2
# would then still resolve, silently handing us an SSD's temp3_input.
# Anchored here it simply CEASES TO EXIST, and noctalia warns and falls back
# to auto-detect: fail closed, not fail wrong. Only one hwmon lives under
# this function, so hwmon2 is the sole occupant, not a guess.
#
# NB this is a PC hardware fact in a file the thinkpad also loads (noctalia
# reads every *.toml in the config dir, and home/noctalia.nix symlinks the
# whole dir — there is no per-host slot here like home/niri/hosts/). On the
# Intel machine the path is absent, so expect a "configured CPU temperature
# sensor does not exist" warning followed by its normal coretemp detection.
# If that fallback ever doesn't happen, resolve the sensor to a fixed
# host-agnostic path at boot instead of naming it here.
cpu_temp_sensor_path = "/sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon2/temp3_input"

# (No [hooks] section: every template consumer picks up its rewrite on its
# own — alacritty live-reloads, GTK/Qt re-read, and niri watches its
# includes. The hyprland era needed colors_changed = "hyprctl reload" here
# because hyprland didn't watch files; that whole ritual is gone.)
